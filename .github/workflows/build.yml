name: Build MoviFlix APKs

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: "Build APK — arm64 (64-bit) + arm32 (32-bit)"
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Download the REAL gradle-wrapper.jar ──────────────────────────────
      #    The jar committed in the repo is a stub placeholder.
      #    We fetch the official one from Gradle's GitHub before anything else.
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "wrapper jar size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      # ── 4. Cache Gradle home ─────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 5. Grant execute permission ──────────────────────────────────────────
      - name: Chmod gradlew
        run: chmod +x gradlew

      # ── 6. Build all ABI splits ──────────────────────────────────────────────
      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 7. Rename APKs ───────────────────────────────────────────────────────
      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/debug
          ls -lh
          [ -f app-arm64-v8a-debug.apk ]   && cp app-arm64-v8a-debug.apk   MoviFlix-arm64-64bit.apk
          [ -f app-armeabi-v7a-debug.apk ] && cp app-armeabi-v7a-debug.apk MoviFlix-arm32-32bit.apk
          [ -f app-universal-debug.apk ]   && cp app-universal-debug.apk   MoviFlix-universal.apk
          ls -lh *.apk

      # ── 8. Upload arm64 (64-bit) ─────────────────────────────────────────────
      - name: "📦 arm64 APK (64-bit)"
        uses: actions/upload-artifact@v4
        with:
          name: MoviFlix-arm64-64bit
          path: app/build/outputs/apk/debug/MoviFlix-arm64-64bit.apk
          if-no-files-found: error
          retention-days: 30

      # ── 9. Upload arm32 (32-bit) ─────────────────────────────────────────────
      - name: "📦 arm32 APK (32-bit)"
        uses: actions/upload-artifact@v4
        with:
          name: MoviFlix-arm32-32bit
          path: app/build/outputs/apk/debug/MoviFlix-arm32-32bit.apk
          if-no-files-found: error
          retention-days: 30

      # ── 10. Upload universal ──────────────────────────────────────────────────
      - name: "📦 Universal APK"
        uses: actions/upload-artifact@v4
        with:
          name: MoviFlix-universal
          path: app/build/outputs/apk/debug/MoviFlix-universal.apk
          if-no-files-found: warn
          retention-days: 30

      # ── 11. GitHub Release on tag (v1.0.0 …) ────────────────────────────────
      - name: "🚀 Create GitHub Release"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "MoviFlix ${{ github.ref_name }}"
          body: |
            ## 📱 MoviFlix ${{ github.ref_name }}

            | ملف APK | الهواتف المدعومة |
            |---------|-----------------|
            | `MoviFlix-arm64-64bit.apk` | ✅ معظم الهواتف الحديثة (64-bit) |
            | `MoviFlix-arm32-32bit.apk` | ✅ الهواتف القديمة (32-bit) |
            | `MoviFlix-universal.apk`   | ✅ يشتغل على الكل |
          files: |
            app/build/outputs/apk/debug/MoviFlix-arm64-64bit.apk
            app/build/outputs/apk/debug/MoviFlix-arm32-32bit.apk
            app/build/outputs/apk/debug/MoviFlix-universal.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
